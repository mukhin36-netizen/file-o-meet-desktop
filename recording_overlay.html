<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;
  color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  user-select:none;-webkit-user-select:none}
.pill{box-sizing:border-box;width:100%;height:100%;border-radius:14px;
  background:#17172cf5;border:1px solid #a078eeaa;
  box-shadow:0 7px 25px #100d2388;
  display:flex;align-items:center;gap:10px;padding:9px 13px;
  -webkit-app-region:drag}
.dot{width:10px;height:10px;background:#ff4962;border-radius:100%;
  flex:none;box-shadow:0 0 0 3px #ff49622b;
  animation:pulse 1.25s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px #ff496210}}
.copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.copy strong{font-size:12px;font-weight:790;white-space:nowrap}
.copy small{font-size:10.5px;color:#cfc5e8;letter-spacing:.03em;
  font-variant-numeric:tabular-nums}
#show{background:#30254d;border:1px solid #7765b0;color:#ebe5ff;
  border-radius:8px;width:26px;height:26px;font-size:15px;
  cursor:pointer;-webkit-app-region:no-drag}
#show:hover{background:#52367f}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
<script src="recording_overlay.js" defer></script>
</head>
<body>
<div class="pill" role="status" aria-live="polite" aria-label="Идёт запись встречи FILE-O Meet">
  <span class="dot" aria-hidden="true"></span>
  <div class="copy"><strong>Идёт запись</strong><small id="clock">00:00</small></div>
  <button id="show" type="button" aria-label="Открыть FILE-O Meet" title="Открыть FILE-O Meet">↗</button>
</div>
</body>
</html>
