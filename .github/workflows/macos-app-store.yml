name: FILE-O Meet Mac App Store

on:
  push:
    branches: [main]
    paths:
      - 'pack-mas.cjs'
      - 'main.cjs'
      - 'preload.cjs'
      - 'renderer.js'
      - 'build/entitlements.mas*.plist'
      - 'tests/mas_policy.test.cjs'
      - '.github/workflows/macos-app-store.yml'
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Create a signed MAS package (requires separate distribution certificates and profile)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  mas-build:
    name: Mac App Store universal app — validation
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Automated tests
        run: npm test
      - name: Verify plist templates
        run: |
          set -euo pipefail
          plutil -lint build/entitlements.mas.plist build/entitlements.mas.inherit.plist
      - name: Import Mac App Store signing identities
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.signed_release) || (github.event_name == 'push' && github.event.head_commit.message == 'mac-app-store-upload-1-0-build2')) }}
        shell: bash
        env:
          FILEO_MAS_DIST_P12_BASE64: ${{ secrets.FILEO_MAS_DIST_P12_BASE64 }}
          FILEO_MAS_DIST_P12_PASSWORD: ${{ secrets.FILEO_MAS_DIST_P12_PASSWORD }}
          FILEO_MAS_INSTALLER_P12_BASE64: ${{ secrets.FILEO_MAS_INSTALLER_P12_BASE64 }}
          FILEO_MAS_INSTALLER_P12_PASSWORD: ${{ secrets.FILEO_MAS_INSTALLER_P12_PASSWORD }}
          FILEO_MAS_APP_IDENTITY: ${{ secrets.FILEO_MAS_APP_IDENTITY }}
          FILEO_MAS_INSTALLER_IDENTITY: ${{ secrets.FILEO_MAS_INSTALLER_IDENTITY }}
          FILEO_MAS_PROFILE_BASE64: ${{ secrets.FILEO_MAS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for key in FILEO_MAS_DIST_P12_BASE64 FILEO_MAS_DIST_P12_PASSWORD FILEO_MAS_INSTALLER_P12_BASE64 FILEO_MAS_INSTALLER_P12_PASSWORD FILEO_MAS_APP_IDENTITY FILEO_MAS_INSTALLER_IDENTITY FILEO_MAS_PROFILE_BASE64; do
            if [ -z "$(printenv "$key")" ]; then
              echo "::error::Missing Mac App Store secret: $key"
              exit 1
            fi
          done
          umask 077
          OSSL="$(brew --prefix openssl@3)/bin/openssl"
          KEYCHAIN="$RUNNER_TEMP/fileo-mas.keychain-db"
          KEYCHAIN_PASSWORD="$("$OSSL" rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          import_p12 () {
            local name="$1" encoded="$2" passwd="$3"
            local original="$RUNNER_TEMP/$name-original.p12"
            local extracted="$RUNNER_TEMP/$name-temporary.pem"
            local compat="$RUNNER_TEMP/$name-macos.p12"
            printf '%s' "$encoded" | base64 -D > "$original"
            export P12_IMPORT_PASSWORD="$passwd"
            "$OSSL" pkcs12 -in "$original" -passin env:P12_IMPORT_PASSWORD -noout
            "$OSSL" pkcs12 -in "$original" -passin env:P12_IMPORT_PASSWORD -nodes -out "$extracted"
            "$OSSL" pkcs12 -export -in "$extracted" -out "$compat" -passout env:P12_IMPORT_PASSWORD -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
            security import "$compat" -k "$KEYCHAIN" -P "$passwd" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm -f "$original" "$extracted" "$compat"
            unset P12_IMPORT_PASSWORD
          }
          import_p12 app "$FILEO_MAS_DIST_P12_BASE64" "$FILEO_MAS_DIST_P12_PASSWORD"
          import_p12 installer "$FILEO_MAS_INSTALLER_P12_BASE64" "$FILEO_MAS_INSTALLER_P12_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v "$KEYCHAIN"
          PROFILE="$RUNNER_TEMP/FILE-O-Meet-AppStore.provisionprofile"
          printf '%s' "$FILEO_MAS_PROFILE_BASE64" | base64 -D > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist" | grep -Fx 'RWWC682LU6'
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/profile.plist" | grep -Fx 'RWWC682LU6.com.fileo.meeting'
          echo "FILEO_MAS_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "FILEO_MAS_PROVISIONING_PROFILE=$PROFILE" >> "$GITHUB_ENV"
      - name: Package universal MAS Electron app
        env:
          FILEO_MAS_SIGNED: ${{ ((github.event_name == 'workflow_dispatch' && inputs.signed_release) || (github.event_name == 'push' && github.event.head_commit.message == 'mac-app-store-upload-1-0-build2')) && '1' || '0' }}
          FILEO_MAS_APP_IDENTITY: ${{ secrets.FILEO_MAS_APP_IDENTITY }}
          FILEO_MAS_KEYCHAIN: ${{ env.FILEO_MAS_SIGNING_KEYCHAIN }}
          FILEO_MAS_PROFILE: ${{ env.FILEO_MAS_PROVISIONING_PROFILE }}
        run: node pack-mas.cjs
      - name: Verify bundle and signatures
        shell: bash
        env:
          FILEO_MAS_SIGNED: ${{ ((github.event_name == 'workflow_dispatch' && inputs.signed_release) || (github.event_name == 'push' && github.event.head_commit.message == 'mac-app-store-upload-1-0-build2')) && '1' || '0' }}
        run: |
          set -euo pipefail
          APP="dist/FILE-O-Meeting-mas-universal/FILE-O-Meeting.app"
          test -d "$APP"
          PLIST="$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "com.fileo.meeting"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "1.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "2"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$PLIST" > /dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSAudioCaptureUsageDescription' "$PLIST" > /dev/null
          lipo -info "$APP/Contents/MacOS/FILE-O-Meeting" | tee "$RUNNER_TEMP/mas-architecture.txt"
          grep -q "x86_64" "$RUNNER_TEMP/mas-architecture.txt"
          grep -q "arm64" "$RUNNER_TEMP/mas-architecture.txt"
          if [ "$FILEO_MAS_SIGNED" = "1" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP"
            # codesign can emit DER entitlements by default; --xml forces a
            # parseable property list. PlistBuddy treats dotted entitlement
            # names as literal keys, unlike plutil -extract (keypath syntax).
            ENTITLEMENTS="$RUNNER_TEMP/mas-entitlements.plist"
            codesign -d --entitlements - --xml "$APP" > "$ENTITLEMENTS" 2>/dev/null
            plutil -lint "$ENTITLEMENTS"
            sandbox_value="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$ENTITLEMENTS")"
            echo "Signed app sandbox entitlement: $sandbox_value"
            if [ "$sandbox_value" != 'true' ]; then
              echo "::error::App Sandbox is not enabled in the actual code signature"
              exit 1
            fi
            if [ ! -f "$APP/Contents/embedded.provisionprofile" ]; then
              echo "::error::Signed MAS app has no embedded provisioning profile"
              exit 1
            fi
            security cms -D -i "$APP/Contents/embedded.provisionprofile" > "$RUNNER_TEMP/embedded-profile.plist"
            /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$RUNNER_TEMP/embedded-profile.plist" | grep -Fx 'RWWC682LU6.com.fileo.meeting'
          else
            echo "::warning::MAS QA is unsigned: entitlements and sandbox runtime not validated. This artifact is NOT FOR APP STORE SUBMISSION."
          fi
      - name: Ensure installed app files are readable by non-root users
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.signed_release) || (github.event_name == 'push' && github.event.head_commit.message == 'mac-app-store-upload-1-0-build2') }}
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/FILE-O-Meeting-mas-universal/FILE-O-Meeting.app"
          # A CI-created provisioning profile is private (0600) by default.
          # productbuild preserves that mode, and App Store Connect rejects a
          # package containing app resources unreadable by standard users.
          # Grant all users read access to files and search access to dirs,
          # retaining executable bits only where they already exist.
          chmod -R a+rX "$APP"
          if find "$APP" -type f ! -perm -004 -print | grep -q .; then
            echo "::error::Some app files are unreadable by non-root users"
            find "$APP" -type f ! -perm -004 -print | head -25
            exit 1
          fi
          if find "$APP" -type d ! -perm -005 -print | grep -q .; then
            echo "::error::Some app directories are inaccessible to non-root users"
            find "$APP" -type d ! -perm -005 -print | head -25
            exit 1
          fi
          test -r "$APP/Contents/embedded.provisionprofile"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "APP_STORE_FILE_PERMISSIONS_OK"
      - name: Build Mac App Store installer package
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.signed_release) || (github.event_name == 'push' && github.event.head_commit.message == 'mac-app-store-upload-1-0-build2')) }}
        shell: bash
        env:
          FILEO_MAS_INSTALLER_IDENTITY: ${{ secrets.FILEO_MAS_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          mkdir -p store-output
          productbuild --component "dist/FILE-O-Meeting-mas-universal/FILE-O-Meeting.app" /Applications --sign "$FILEO_MAS_INSTALLER_IDENTITY" --keychain "$FILEO_MAS_SIGNING_KEYCHAIN" "store-output/FILE-O-Meet-Mac-App-Store-1.0-build2.pkg"
          pkgutil --check-signature "store-output/FILE-O-Meet-Mac-App-Store-1.0-build2.pkg"
          shasum -a 256 store-output/*.pkg > store-output/SHA256SUMS
      - name: Upload signed installer for manual App Store Connect submission
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.signed_release) || (github.event_name == 'push' && github.event.head_commit.message == 'mac-app-store-upload-1-0-build2')) }}
        uses: actions/upload-artifact@v6
        with:
          name: FILE-O-Meet-Mac-App-Store-1.0-BUILD2-SIGNED-PKG
          path: store-output/
          if-no-files-found: error
          retention-days: 30
      # The upload is deliberately one-off and never runs in normal CI.
      # It validates and delivers the signed PKG but does NOT submit for review.
      - name: Validate signed installer with App Store Connect
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'mac-app-store-upload-1-0-build2' }}
        shell: bash
        env:
          FILEO_APPLE_ID: ${{ secrets.FILEO_APPLE_ID }}
          FILEO_APPLE_APP_PASSWORD: ${{ secrets.FILEO_APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FILEO_APPLE_ID:?Apple ID secret required}"
          : "${FILEO_APPLE_APP_PASSWORD:?App-specific password secret required}"
          xcrun altool --validate-app --file "store-output/FILE-O-Meet-Mac-App-Store-1.0-build2.pkg" --type macos --username "$FILEO_APPLE_ID" --password "@env:FILEO_APPLE_APP_PASSWORD"
      - name: Upload FILE-O Meet 1.0 to App Store Connect
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'mac-app-store-upload-1-0-build2' }}
        shell: bash
        env:
          FILEO_APPLE_ID: ${{ secrets.FILEO_APPLE_ID }}
          FILEO_APPLE_APP_PASSWORD: ${{ secrets.FILEO_APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app --file "store-output/FILE-O-Meet-Mac-App-Store-1.0-build2.pkg" --type macos --username "$FILEO_APPLE_ID" --password "@env:FILEO_APPLE_APP_PASSWORD"
          echo "APP_STORE_CONNECT_UPLOAD_SUBMITTED: build 1.0 (2), com.fileo.meeting"
      - name: Record unsigned QA result without distribution
        if: ${{ !(((github.event_name == 'workflow_dispatch' && inputs.signed_release) || (github.event_name == 'push' && github.event.head_commit.message == 'mac-app-store-upload-1-0-build2'))) }}
        run: |
          echo "Mac App Store universal app was packaged and metadata checked."
          echo "No signing certificates installed; no store package released."
