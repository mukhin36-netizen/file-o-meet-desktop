name: FILE-O Meet Windows MSIX
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows-msix:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build standalone WASAPI system audio helper
        shell: pwsh
        run: |
          dotnet publish native/windows/FileoSystemAudio.csproj --configuration Release --runtime win-x64 --self-contained true --output native/bin -p:PublishSingleFile=true -p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { throw 'WASAPI loopback build failed' }
          $helper = 'native/bin/fileo-system-audio.exe'
          if (-not (Test-Path $helper)) { throw 'WASAPI helper missing' }
          $pcm = Join-Path $env:RUNNER_TEMP 'fileo-wasapi-selftest.pcm'
          $proc = Start-Process -FilePath (Resolve-Path $helper).Path -ArgumentList '--self-test' -RedirectStandardOutput $pcm -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw 'WASAPI self-test returned nonzero' }
          if ((Get-Item $pcm).Length -ne 6400) { throw 'WASAPI test produced unexpected PCM size' }
          Write-Host 'WASAPI_HELPER_SELFTEST_OK 16kHz mono PCM, 200ms'
      - name: Build Windows Electron x64
        shell: pwsh
        run: |
          node pack-windows.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Electron Windows packaging failed' }
          $resource = 'dist/FILE-O-Meeting-win32-x64/resources/fileo-system-audio.exe'
          if (-not (Test-Path $resource)) { throw 'WASAPI helper absent from packaged app' }
      - name: Assemble unsigned MSIX with Windows SDK MakeAppx
        shell: pwsh
        run: |
          $app = (Resolve-Path 'dist/FILE-O-Meeting-win32-x64').Path
          Copy-Item 'Package.appxmanifest' (Join-Path $app 'AppxManifest.xml')
          Copy-Item 'store-assets' (Join-Path $app 'StoreAssets') -Recurse
          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\makeappx.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $sdk) { throw 'Windows SDK makeappx.exe not found' }
          New-Item -ItemType Directory -Force 'store-output' | Out-Null
          $output = (Join-Path (Resolve-Path 'store-output').Path 'FILE-O-Meet_0.6.5.0_x64.msix')
          & $sdk pack /v /o /d $app /p $output
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $output)) { throw 'MSIX package creation failed' }
          Write-Host "Created $output"
      - name: Create Windows portable ZIP
        shell: pwsh
        run: |
          $archive = 'store-output/FILE-O-Meet_0.6.5_Windows_x64_Portable.zip'
          Compress-Archive -Path 'dist/FILE-O-Meeting-win32-x64' -DestinationPath $archive -CompressionLevel Optimal -Force
          if (-not (Test-Path $archive)) { throw 'Portable Windows ZIP not created' }
      - uses: actions/upload-artifact@v6
        with:
          name: FILE-O-Meet-0.6.5-Windows-x64-Portable
          path: store-output/*.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v6
        with:
          name: FILE-O-Meet-0.6.5.0-unsigned-MSIX
          path: store-output/*.msix
          if-no-files-found: error
          retention-days: 30
